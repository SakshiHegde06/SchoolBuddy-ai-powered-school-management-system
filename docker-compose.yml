version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: schoolbuddy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: schoolbuddy
    volumes:
      - mongo-data:/data/db

  ai-service:
    build:
      context: ./ai-service
    container_name: schoolbuddy-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  backend:
    build:
      context: ./backend
    container_name: schoolbuddy-backend
    restart: unless-stopped
    depends_on:
      - mongo
      - ai-service
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/schoolbuddy
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string-in-production-min-32-bytes}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-System Admin}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@school.edu}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-ChangeMe123!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://frontend}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key}

  frontend:
    build:
      context: ./frontend
    container_name: schoolbuddy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}

volumes:
  mongo-data:
