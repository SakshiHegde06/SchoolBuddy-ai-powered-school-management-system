server:
  port: 8080

spring:
  application:
    name: school-backend
  data:
    mongodb:
       uri: ${MONGODB_URI:mongodb://localhost:27017/schoolbuddy}
  codec:
    log-request-details: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-production-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
    admin-seed:
    name: ${ADMIN_SEED_NAME:System Admin}
    email: ${ADMIN_SEED_EMAIL:admin@school.edu}
    password: ${ADMIN_SEED_PASSWORD:ChangeMe123!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}

logging:
  level:
    com.school: INFO
    org.springframework.security: WARN
    org.springframework.web.reactive.function.client: TRACE
    reactor.netty.http.client: TRACE